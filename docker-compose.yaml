# ============================================================
# Fahrtenbuch – Docker Compose (lokal / Entwicklung)
#
#   http://localhost:${FRONTEND_PORT}/      → frontend (nginx)
#   http://localhost:${FRONTEND_PORT}/api/  → nginx leitet an backend:3000 weiter
#
# Das Datenbankschema legt das Backend beim Start selbst an
# (backend/migrations/).
# ============================================================

services:

  # ──────────────────────────────────────────────────────────
  # PostgreSQL Datenbank
  # ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: fahrtenbuch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-fahrtenbuch}
      POSTGRES_USER:     ${DB_USER:-fahrtenbuch}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fahrtenbuch}
    volumes:
      - ./backend/data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fahrtenbuch} -d ${DB_NAME:-fahrtenbuch}"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks:
      - fahrtenbuch

  # ──────────────────────────────────────────────────────────
  # Tägliches Datenbank-Backup (gzip, alte Dateien werden gelöscht)
  # ──────────────────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: fahrtenbuch-backup
    restart: unless-stopped
    depends_on:
      # erst sichern, wenn das Backend die Migrationen eingespielt hat
      backend:
        condition: service_healthy
    environment:
      PGHOST:           db
      PGDATABASE:       ${DB_NAME:-fahrtenbuch}
      PGUSER:           ${DB_USER:-fahrtenbuch}
      PGPASSWORD:       ${DB_PASSWORD:-fahrtenbuch}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backend/data/backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -o pipefail
        while true; do
          file="/backups/fahrtenbuch_$$(date +%Y-%m-%d_%H%M).sql.gz"
          if pg_dump --no-owner | gzip > "$$file.tmp"; then
            mv "$$file.tmp" "$$file" && echo "Backup erstellt: $$file"
          else
            rm -f "$$file.tmp" && echo "Backup fehlgeschlagen" >&2
          fi
          find /backups -name 'fahrtenbuch_*.sql.gz' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep 86400
        done
    networks:
      - fahrtenbuch

  # ──────────────────────────────────────────────────────────
  # Node.js Backend (nur intern erreichbar, über nginx)
  # ──────────────────────────────────────────────────────────
  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    container_name: fahrtenbuch-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT:        3000
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME:-fahrtenbuch}
      DB_USER:     ${DB_USER:-fahrtenbuch}
      DB_PASSWORD: ${DB_PASSWORD:-fahrtenbuch}
      JWT_SECRET:  ${JWT_SECRET:?JWT_SECRET muss in .env gesetzt sein}
      JWT_EXPIRES: ${JWT_EXPIRES:-8h}
      ADMIN_USERNAME:     ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD:     ${ADMIN_PASSWORD:-}
      CORS_ORIGIN:        ${CORS_ORIGIN:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      NOMINATIM_EMAIL:    ${NOMINATIM_EMAIL:-}
      # Frontend-nginx leitet /api weiter → 1 Proxy vor dem Backend
      TRUST_PROXY:        ${TRUST_PROXY:-1}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout:  5s
      retries:  5
      start_period: 20s
    networks:
      - fahrtenbuch

  # ──────────────────────────────────────────────────────────
  # Nginx Frontend
  # ──────────────────────────────────────────────────────────
  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
    container_name: fahrtenbuch-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - fahrtenbuch

networks:
  fahrtenbuch:
    driver: bridge
