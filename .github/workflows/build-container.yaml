name: Build & Push Docker Images to GHCR

on:
  push:
    branches:
      - "**"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: |
          DATE=$(date +"%Y.%m.%d")
          RAND=$(uuidgen | cut -d'-' -f1)
          echo "image_tag=${DATE}-${RAND}" >> $GITHUB_OUTPUT

      - name: Detect changed folders
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/fahrtenbuch-frontend:${{ needs.detect-changes.outputs.image_tag }} \
            -f frontend/Dockerfile \
            frontend

          docker push ghcr.io/${{ github.repository_owner }}/fahrtenbuch-frontend:${{ needs.detect-changes.outputs.image_tag }}

  backend-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       fahrtenbuch_test
          POSTGRES_USER:     fahrtenbuch
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fahrtenbuch -d fahrtenbuch_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Tests
        run: npm test
        env:
          DB_HOST:     127.0.0.1
          DB_PORT:     5432
          DB_NAME:     fahrtenbuch_test
          DB_USER:     fahrtenbuch
          DB_PASSWORD: test

  backend:
    needs: [detect-changes, backend-test]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/fahrtenbuch-backend:${{ needs.detect-changes.outputs.image_tag }} \
            -f backend/Dockerfile \
            backend

          docker push ghcr.io/${{ github.repository_owner }}/fahrtenbuch-backend:${{ needs.detect-changes.outputs.image_tag }}
