<li class="nav-item">

<div class="container py-5 flex-fill">
  <div class="card shadow-sm">
    <div class="card-body">
      <h3 class="card-title mb-4">Fahrtenbuch</h3>

      <div id="statusMeldung" class="d-none" role="status" aria-live="polite"></div>

      <div id="offlineHinweis" class="d-none">
        <div class="alert alert-info d-flex justify-content-between align-items-center">
          <span>📴 <span id="offlineAnzahl"></span> auf die Übertragung.</span>
          <button class="btn btn-sm btn-outline-primary" type="button" id="syncJetzt">Jetzt senden</button>
        </div>
      </div>

      <div class="mb-3">
        <label for="kmstand" class="form-label">KM Stand</label>
        <input type="number" inputmode="numeric" min="0" class="form-control" id="kmstand" placeholder="Kilometerstand eingeben...">
      </div>

      <div class="mb-3">
        <label for="ziel" class="form-label">Ziel / Kundenname</label>
        <div class="input-group">
          <input type="text" class="form-control" id="ziel" placeholder="Ziel oder Kundenname eingeben...">
          <button class="btn btn-outline-secondary" type="button" onclick="getLocation()">📍 Standort</button>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label d-block">Fahrtart</label>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="fahrtart" id="geschaeftlich" value="geschäftlich" checked>
          <label class="form-check-label" for="geschaeftlich">Geschäftlich</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="fahrtart" id="privat" value="privat">
          <label class="form-check-label" for="privat">Privat</label>
        </div>
      </div>

      <div class="mb-3 d-none" id="vehicleGroup">
        <label for="vehicleName" class="form-label">Fahrzeug</label>
        <input type="text" class="form-control" id="vehicleName" readonly>
        <div class="form-text">Das Fahrzeug wechselst du oben in der Navigation.</div>
      </div>

      <button class="btn btn-success me-2" onclick="addFahrt()">Absenden</button>
      <button class="btn btn-primary me-2" onclick="downloadCSV()">CSV Export (Jahr)</button>
      <button class="btn btn-secondary me-2" onclick="downloadJSON()">JSON Export</button>
      <a href="index.html" class="btn btn-info">Dashboard</a>
    </div>
  </div>
</div>
<script src="js/auth-check.js"></script>
<script src="js/config.js"></script>
<script src="js/fahrzeug.js"></script>
<script src="js/offline.js"></script>

    © <span id="year"></span> Fahrtenbuch · Version <span id="appVersion">-</span>
  </div>
</footer>

<script>
  document.getElementById("year").innerText = new Date().getFullYear();
</script>
<script src="js/footer.js"></script>
</body>
