<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title data-i18n="dashboard.pageTitle">Fahrtenbuch Dashboard</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#212529">
<script src="js/theme.js"></script>
<script src="js/i18n.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
<link href="css/app.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet" integrity="sha384-HphS8cQyN+eYiJ5PMbzShG6qZdRtvHPVLPkYb8JwMkmNgaIxrFVDhQe3jIbq3EZ2" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">

<!-- 🔹 Menüleiste -->
<nav id="hauptnavigation" class="navbar navbar-expand-lg navbar-dark bg-dark"></nav>
<script src="js/nav.js"></script>

<!-- 🔹 Dashboard Inhalt -->
<main class="container py-3 py-md-4 flex-fill">
  <div id="sicherungHinweis" class="alert alert-warning d-flex flex-wrap align-items-center gap-2 d-none" role="status">
    <span class="flex-grow-1" id="sicherungHinweisText"></span>
    <button class="btn btn-sm btn-warning" id="sicherungJetztBtn" data-i18n="dashboard.backupNow">Jetzt sichern</button>
  </div>

  <div class="d-flex flex-wrap align-items-baseline justify-content-between gap-2 mb-3">
    <h1 class="h3 mb-0"><span data-i18n="dashboard.title">Dashboard</span> <span class="text-muted fw-normal" id="dashboardJahr"></span></h1>
    <a href="driving.html" class="btn btn-success"><span class="mdi mdi-plus me-1"></span><span data-i18n="nav.newTrip">Neue Fahrt</span></a>
  </div>

  <div id="dashboardInhalt">
    <div class="text-center text-muted py-5"><div class="spinner-border spinner-border-sm me-2"></div><span data-i18n="dashboard.loading">Lade Daten …</span></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
<script src="js/auth-check.js"></script>
<script src="js/config.js"></script>
<script src="js/fahrzeug.js"></script>
<script src="js/offline.js"></script>
<script src="js/sicherung.js"></script>
<script src="js/auswertung.js"></script>
<script src="js/dashboard.js"></script>

<footer class="bg-dark text-light mt-4">
  <div class="container py-3 text-center small">
    © <span id="year"></span> <span data-i18n="footer.appName">Fahrtenbuch</span> · <span data-i18n="footer.version">Version</span> <span id="appVersion">-</span>
  </div>
</footer>

<script>
  document.getElementById("year").innerText = new Date().getFullYear();
</script>
<script src="js/footer.js"></script>
</body>
</html>
