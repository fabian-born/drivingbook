<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Fahrtenbuch – Jahreshistorie</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#212529">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>

<link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet" integrity="sha384-HphS8cQyN+eYiJ5PMbzShG6qZdRtvHPVLPkYb8JwMkmNgaIxrFVDhQe3jIbq3EZ2" crossorigin="anonymous">
<style>
  /* Steuerleiste: gut antippbar */
  .steuerleiste .form-select, .steuerleiste .btn { min-height: 44px; }

  /* ── Druck: A4 Querformat ──────────────────────────────────── */
  @media print {
    @page { size: A4 landscape; margin: 10mm 12mm; }
    nav, footer, .no-print { display: none !important; }
    body { background: #fff !important; font-size: 9pt;
           -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .container { max-width: 100% !important; padding: 0 !important; }
    .print-header { display: flex !important; justify-content: space-between; align-items: baseline;
                    border-bottom: 2px solid #212529; padding-bottom: 4pt; margin-bottom: 8pt; }
    .print-header h2 { font-size: 13pt; margin: 0; }
    .print-header span { font-size: 9pt; color: #555; }
    .card { box-shadow: none !important; border: 1px solid #ccc !important; break-inside: avoid; }
    .card-body { padding: 4pt 6pt !important; }
    .kennzahl-wert { font-size: 12pt !important; }
    .col-lg-4 { width: 34% !important; } .col-lg-8 { width: 66% !important; }
    .monats-tabelle { font-size: 8pt; }
    .monats-tabelle th, .monats-tabelle td { padding: 2pt 4pt !important; }
    .monats-tabelle thead th { background: #212529 !important; color: #fff !important; }
  }
</style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Navbar -->
<nav id="hauptnavigation" class="navbar navbar-expand-lg navbar-dark bg-dark"></nav>
<script src="js/nav.js"></script>

<!-- Hauptinhalt -->
<main class="container py-3 py-md-4 flex-fill">

  <!-- Steuerleiste (wird nicht gedruckt) -->
  <div class="d-flex flex-wrap align-items-center gap-2 mb-3 no-print steuerleiste">
    <h1 class="h3 mb-0 me-auto">Jahreshistorie</h1>
    <div class="d-flex gap-2">
      <select id="historyJahrSelect" class="form-select w-auto" aria-label="Jahr"></select>
      <button id="historyCSVExport" class="btn btn-outline-secondary" title="CSV-Export des Jahres">
        <span class="mdi mdi-file-delimited-outline"></span><span class="d-none d-sm-inline ms-1">CSV</span>
      </button>
      <button id="historyPDFExport" class="btn btn-outline-secondary" title="Seite drucken bzw. als PDF speichern">
        <span class="mdi mdi-printer-outline"></span><span class="d-none d-sm-inline ms-1">Drucken</span>
      </button>
    </div>
  </div>

  <!-- Druckkopf (nur im Druck sichtbar) -->
  <div class="print-header" style="display:none;">
    <h2 id="printHeadline">Fahrtenbuch – Jahreshistorie</h2>
    <span id="printDatum"></span>
  </div>

  <div id="historyContent">
    <div class="text-center text-muted py-5"><div class="spinner-border spinner-border-sm me-2"></div>Lade Daten …</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
<script src="js/auth-check.js"></script>
<script src="js/config.js"></script>
<script src="js/fahrzeug.js"></script>
<script src="js/offline.js"></script>
<script src="js/auswertung.js"></script>
<script src="js/dashboard-history.js"></script>

<!-- Druckkopf mit Jahr + Datum befüllen -->
<script>
  document.getElementById("printDatum").textContent =
    "Erstellt: " + new Date().toLocaleDateString("de-DE");

  document.getElementById("historyJahrSelect")?.addEventListener("change", function () {
    document.getElementById("printHeadline").textContent =
      "Fahrtenbuch – Jahreshistorie " + this.value;
    document.getElementById("printDatum").textContent =
      "Erstellt: " + new Date().toLocaleDateString("de-DE");
  });
</script>

<footer class="bg-dark text-light mt-4">
  <div class="container py-3 text-center small">
    © <span id="year"></span> Fahrtenbuch · Version <span id="appVersion">-</span>
  </div>
</footer>

<script>
  document.getElementById("year").innerText = new Date().getFullYear();
</script>
<script src="js/footer.js"></script>
</body>
</html>
