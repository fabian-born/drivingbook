<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title data-i18n="register.pageTitle">Registrierung – Fahrtenbuch</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#212529">
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
<link href="css/app.css" rel="stylesheet">
</head>

<body class="bg-body-tertiary d-flex align-items-center justify-content-center min-vh-100">

<div class="card shadow-sm" style="width: 100%; max-width: 440px;">
  <div class="card-body p-4">

    <!-- ── Registration form ── -->
    <div id="viewForm">
      <h3 class="text-center mb-4" data-i18n="register.title">📋 Konto erstellen</h3>

      <div id="regError" class="alert alert-danger d-none"></div>

      <div class="mb-3">
        <label class="form-label" for="username" data-i18n="login.username">Benutzername</label>
        <input type="text" id="username" class="form-control" placeholder="z. B. max.mustermann" data-i18n-attr="placeholder:register.usernamePlaceholder" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" style="text-transform: lowercase" required>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password"><span data-i18n="login.password">Passwort</span> <span class="text-muted small" data-i18n="register.minLength">(min. 8 Zeichen)</span></label>
        <input type="password" id="password" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label" for="passwordConfirm" data-i18n="register.passwordRepeat">Passwort wiederholen</label>
        <input type="password" id="passwordConfirm" class="form-control" required>
      </div>

      <div class="mb-4">
        <label class="form-label" for="vehicleName"><span data-i18n="register.firstVehicle">Erstes Fahrzeug</span> <span class="text-muted small" data-i18n="register.optional">(optional)</span></label>
        <input type="text" id="vehicleName" class="form-control" placeholder="z. B. VW Golf, Firmenwagen …" data-i18n-attr="placeholder:register.vehiclePlaceholder">
      </div>

      <button class="btn btn-primary w-100" id="registerBtn" data-i18n="register.submit">Registrieren</button>

      <p class="text-center text-muted small mt-3 mb-0">
        <span data-i18n="register.haveAccount">Bereits ein Konto?</span> <a href="login.html" data-i18n="login.submit">Anmelden</a>
      </p>
    </div>

    <!-- ── Success: show API token ── -->
    <div id="viewSuccess" class="d-none">
      <div class="text-center mb-3">
        <span style="font-size:2.5rem;">✅</span>
        <h4 class="mt-2" data-i18n="register.created">Konto erstellt!</h4>
        <p class="text-muted small" data-i18n="register.saveToken">Bitte speichere deinen API-Token – er wird nur einmal angezeigt.</p>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold" for="tokenDisplay" data-i18n="register.defaultToken">Dein Standard API-Token</label>
        <div class="input-group">
          <input type="text" id="tokenDisplay" class="form-control font-monospace" readonly>
          <button class="btn btn-outline-secondary" id="copyTokenBtn" title="Kopieren" data-i18n-attr="title:register.copy;aria-label:register.copy">📋</button>
        </div>
        <div class="form-text text-warning fw-semibold" data-i18n="register.tokenWarning">
          ⚠️ Dieser Token wird nur einmal angezeigt. Jetzt kopieren und sicher speichern!
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="vehicleDisplay" data-i18n="register.createdVehicle">Angelegtes Fahrzeug</label>
        <input type="text" id="vehicleDisplay" class="form-control" readonly>
      </div>

      <a href="index.html" class="btn btn-success w-100" data-i18n="register.toDashboard">Zum Dashboard →</a>
    </div>

  </div>
  <div class="card-footer text-muted text-center small py-2">
    © <span id="year"></span> <span data-i18n="footer.appName">Fahrtenbuch</span>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/register.js"></script>
<script>document.getElementById("year").innerText = new Date().getFullYear();</script>
</body>
</html>
