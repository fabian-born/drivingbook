<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Login – Fahrtenbuch</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#212529">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-sm" style="width: 100%; max-width: 400px;">
  <div class="card-body p-4">
    <h3 class="text-center mb-4">🔐 Fahrtenbuch Login</h3>

    <div id="loginError" class="alert alert-danger d-none"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Benutzername</label>
        <input type="text" id="username" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Passwort</label>
        <input type="password" id="password" class="form-control" required>
      </div>

      <button class="btn btn-primary w-100" type="submit">Anmelden</button>
    </form>

    <hr class="my-3">

    <p class="text-center text-muted small mb-0">
      Noch kein Konto? <a href="register.html">Jetzt registrieren</a>
    </p>

    <p class="text-muted text-center mt-3 mb-0" style="font-size: 0.85rem;">
      © <span id="year"></span> Fahrtenbuch
    </p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/login.js"></script>
<script>
  document.getElementById("year").innerText = new Date().getFullYear();
</script>
</body>
</html>
