server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── API → backend container (same origin, no CORS needed) ──
    location ^~ /api/ {
        proxy_pass         http://backend:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── HTML, JS, CSS, language files: no cache ──────────────
    # The browser must always ask the server whether the file has changed
    location ~* \.(html|js|css|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
        etag on;
        expires 0;
    }

    # ── Images, fonts, icons: long cache (rarely change) ──
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        add_header Cache-Control "public, max-age=604800";  # 7 Tage
        expires 7d;
    }

    # ── PWA manifest: correct MIME type, no caching ──────────
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # ── release.ver: never cache ─────────────────────────────
    location = /release.ver {
        add_header Cache-Control "no-store";
        expires -1;
    }

    # ── All other requests → index.html ──────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
