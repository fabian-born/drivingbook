server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── API → Backend-Container (gleiche Origin, kein CORS nötig) ──
    location ^~ /api/ {
        proxy_pass         http://backend:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── HTML, JS, CSS: kein Cache ────────────────────────────
    # Browser muss immer beim Server nachfragen ob sich die Datei geändert hat
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
        etag on;
        expires 0;
    }

    # ── Bilder, Fonts, Icons: langer Cache (ändern sich selten) ──
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        add_header Cache-Control "public, max-age=604800";  # 7 Tage
        expires 7d;
    }

    # ── PWA-Manifest: korrekter MIME-Typ, nicht cachen ───────
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # ── release.ver: niemals cachen ──────────────────────────
    location = /release.ver {
        add_header Cache-Control "no-store";
        expires -1;
    }

    # ── Alle anderen Requests → index.html ───────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
