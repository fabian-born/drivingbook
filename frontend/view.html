<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<title>Fahrten anzeigen</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#212529">
<script src="js/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
<link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet" integrity="sha384-HphS8cQyN+eYiJ5PMbzShG6qZdRtvHPVLPkYb8JwMkmNgaIxrFVDhQe3jIbq3EZ2" crossorigin="anonymous">

<style>
  /* ── Filterleiste: auf dem Desktop mitlaufend, auf dem Smartphone nicht (spart Platz) ── */
  .filter-bar { background: var(--bs-body-bg); border-bottom: 1px solid var(--bs-border-color); padding: .75rem 1rem; }
  @media (min-width: 768px) { .filter-bar { position: sticky; top: 0; z-index: 100; } }

  /* ── Desktop: kompakte Tabelle / Smartphone: Karten ── */
  @media (min-width: 768px) {
    .fahrtart-select { min-width: 120px; }
    .timestamp-input { min-width: 165px; }
    .card-list       { display: none; }
  }
  @media (max-width: 767px) {
    .table-wrap { display: none; }
    /* gut antippbare Bedienelemente */
    .filter-bar .form-select, .filter-bar .btn,
    .fahrt-card .form-control, .fahrt-card .form-select, .fahrt-card .btn { min-height: 44px; }
    .filter-bar .form-select, .filter-bar .btn { font-size: 1rem; }
  }

  /* ── Fahrt-Karte (Smartphone) ── */
  .fahrt-card {
    background: var(--bs-body-bg); border: 1px solid var(--bs-border-color);
    border-left: 4px solid var(--fahrtart-farbe, var(--bs-secondary-color));
    border-radius: .5rem; padding: .75rem; margin-bottom: .6rem;
  }
  .fahrt-card .card-badge { font-size: .75rem; }
  .fahrt-card .card-meta  { font-size: .8rem; color: var(--bs-secondary-color); }
  .fahrt-card .card-km    { font-size: 1.1rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .fahrt-card .card-ziel  { margin-top: .15rem; }
  .fahrt-card .strecke    { font-size: .85rem; color: var(--bs-secondary-color); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .fahrt-card .km-feld    { max-width: 10.5rem; }
  .btn-icon { min-width: 44px; }

  /* Monats-Trennzeile in der Jahresansicht */
  .month-divider {
    background: #343a40; color: #fff; border-radius: .4rem; padding: .4rem .75rem;
    font-size: .85rem; font-weight: 600; margin: 1rem 0 .5rem; letter-spacing: .03em;
  }

  /* Tabellen-Felder kompakter */
  .table td { vertical-align: middle; }
  .table .form-select-sm, .table .form-control-sm { font-size: .8rem; }
  .delete-btn .mdi { font-size: 1rem; }
</style>
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">

<!-- Navbar -->
<nav id="hauptnavigation" class="navbar navbar-expand-lg navbar-dark bg-dark"></nav>
<script src="js/nav.js"></script>

<!-- Filter-Leiste -->
<div class="filter-bar">
  <div class="row g-2 align-items-end">
    <div class="col-4 col-md-2">
      <label class="form-label mb-1 small" for="jahrSelect">Jahr</label>
      <select id="jahrSelect" class="form-select form-select-sm"></select>
    </div>
    <div class="col-4 col-md-2">
      <label class="form-label mb-1 small" for="monatSelect">Monat</label>
      <select id="monatSelect" class="form-select form-select-sm"></select>
    </div>
    <div class="col-4 col-md-2">
      <label class="form-label mb-1 small" for="fahrtartFilter">Fahrtart</label>
      <select id="fahrtartFilter" class="form-select form-select-sm">
        <option value="alle">Alle</option>
        <option value="geschäftlich">Geschäftlich</option>
        <option value="privat">Privat</option>
        <option value="arbeitsweg">Arbeitsweg</option>
      </select>
    </div>
    <div class="col-12 col-md-6">
      <div class="btn-group w-100" role="group" aria-label="Export und Protokoll">
        <button class="btn btn-outline-secondary btn-sm" id="csvExportYear" title="CSV-Export des Jahres">
          <span class="mdi mdi-file-delimited-outline me-1"></span>CSV
        </button>
        <button class="btn btn-outline-secondary btn-sm" id="pdfExportYear" title="PDF-Fahrtenbuch des Jahres">
          <span class="mdi mdi-file-pdf-box me-1"></span>PDF
        </button>
        <button class="btn btn-outline-secondary btn-sm" id="auditYear" title="Änderungsprotokoll des Jahres">
          <span class="mdi mdi-history me-1"></span>Protokoll
        </button>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid py-3 px-3 flex-fill">

  <!-- Summe der aktuellen Auswahl -->
  <div id="auswahlSumme" class="card shadow-sm border-0 mb-3 d-none">
    <div class="card-body py-2 px-3">
      <div class="d-flex flex-wrap justify-content-between align-items-baseline gap-2">
        <strong id="auswahlTitel"></strong>
        <span><span id="auswahlKm" class="fw-semibold"></span> <span class="text-muted small" id="auswahlFahrten"></span></span>
      </div>
      <div class="my-2" id="auswahlBalken"></div>
      <div class="d-flex flex-wrap column-gap-3 row-gap-1 small" id="auswahlLegende"></div>
    </div>
  </div>

  <!-- ── DESKTOP: Tabelle ── -->
  <div class="table-wrap">
    <div class="table-responsive">
      <table class="table table-bordered table-striped table-sm align-middle">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>KM Stand</th>
            <th>Diff</th>
            <th>Ziel / Kunde</th>
            <th>Fahrtart</th>
            <th>Zeitpunkt</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="fahrtenTabelle">
          <tr><td colspan="7">Lade Daten...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ── MOBILE: Card-Liste ── -->
  <div class="card-list" id="cardList">
    <!-- wird per JS befüllt -->
  </div>

</div>

<!-- Bestätigungs-Modal Löschen -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="deleteModalLabel">
          <span class="mdi mdi-delete me-2"></span>Fahrt löschen
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Schließen"></button>
      </div>
      <div class="modal-body">
        <p class="mb-2">Soll diese Fahrt wirklich gelöscht werden?</p>
        <p class="text-muted small mb-0" id="confirmDeleteInfo"></p>
        <input type="hidden" id="confirmDeleteIndex">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
          <span class="mdi mdi-delete me-1"></span>Löschen
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Änderungsprotokoll -->
<div class="modal fade" id="auditModal" tabindex="-1" aria-labelledby="auditModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="auditModalLabel">Änderungsprotokoll</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
      </div>
      <div class="modal-body" id="auditModalBody"></div>
    </div>
  </div>
</div>

<script src="js/auth-check.js"></script>
<script src="js/config.js"></script>
<script src="js/fahrzeug.js"></script>
<script src="js/offline.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
<script src="js/auswertung.js"></script>
<script src="js/view.js"></script>

<footer class="bg-dark text-light mt-5">
  <div class="container py-3 text-center small">
    © <span id="year"></span> Fahrtenbuch · Version <span id="appVersion">-</span>
  </div>
</footer>

<script>
  document.getElementById("year").innerText = new Date().getFullYear();
</script>
<script src="js/footer.js"></script>

</body>
</html>
