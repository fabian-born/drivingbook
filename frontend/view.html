<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<title>Fahrten anzeigen</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- 🔹 Menü -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">Fahrtenbuch</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Menü öffnen">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="driving.html">Neue Fahrt</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="view.html">Fahrten anzeigen</a>
        </li>
	<li class="nav-item">
  <a class="nav-link" href="history.html">Jahreshistorie</a>
</li>
        <li class="nav-item">
          <a class="nav-link" href="index.html">Dashboard</a>
        </li>
      </ul>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm ms-2">
                Logout
        </button>
    </div>
  </div>
</nav>

<!-- 🔹 Filter und Steuerung -->
<div class="container py-4">

  <div class="row mb-3">
    <div class="col-md-3">
      <label class="form-label">Jahr</label>
      <select id="jahrSelect" class="form-select"></select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Monat</label>
      <select id="monatSelect" class="form-select"></select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Fahrtart</label>
      <select id="fahrtartFilter" class="form-select">
        <option value="alle">Alle</option>
        <option value="privat">Privat</option>
        <option value="geschäftlich">Geschäftlich</option>
      </select>
    </div>
    <div class="col-md-3 d-flex align-items-end">
      <button class="btn btn-outline-secondary w-100" id="csvExportYear">CSV Export (Jahr)</button>
    </div>
  </div>

  <!-- 🔹 Tabelle -->
  <div class="table-responsive">
    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>#</th>
          <th>KM Stand</th>
          <th>Gefahrene KM</th>
          <th>Ziel / Kundenname</th>
          <th>Fahrtart</th>
          <th>Zeitpunkt</th>
        </tr>
      </thead>
      <tbody id="fahrtenTabelle">
        <tr><td colspan="6">Lade Daten...</td></tr>
      </tbody>
    </table>
  </div>

</div>
<script src="js/auth-check.js"></script>
<script src="js/config.js"></script>
<script src="js/view.js"></script>

<!-- 🔹 Footer -->
<footer class="bg-dark text-light mt-5">
  <div class="container py-3 text-center small">
    © <span id="year"></span> Fahrtenbuch · Version <span id="appVersion">-</span>
  </div>
</footer>

<script>
  document.getElementById("year").innerText = new Date().getFullYear();
</script>
<script src="js/footer.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
